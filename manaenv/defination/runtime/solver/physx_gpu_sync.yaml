# GPU PhysX, synchronous physics + Kit render (needed for PhysX surface-deformable cloth,
# which only runs with GPU dynamics). Used by board bright_arm6a_cloth.
solver: physx
device: cuda:0
cuda_graph: false
diff_ik_device: cuda:0
diff_ik_cuda_graph: false
disable_fabric: false
use_warp_diff_ik: true
physics_step_mode: sync
kit_render_mode: sync
solver_params:
  solver_type: 1
  min_position_iteration_count: 32
  min_velocity_iteration_count: 4
  enable_ccd: false
