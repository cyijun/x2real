include: x2real/task/bright/fold_towel/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: bright_fold_towel_over_basket
  component_sections:
    termination_component:
      terms:
        success:
          _combine: and
          terms:
          - above:
              _func: object_position_in_zone
              object_cfg: '@towel'
              consecutive_steps: 5
              reference_cfg: '@container'
              x_range: [-0.05, 0.05]
              y_range: [-0.06, 0.06]
              z_range: [0.085, 0.4]
              in_reference_frame: true
          - held:
              _combine: or
              terms:
              - towel_by_left:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@towel_left_contact'
                  force_threshold: 0.05
                  consecutive_steps: 1
              - towel_by_right:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@towel_right_contact'
                  force_threshold: 0.05
                  consecutive_steps: 1
    log_component:
      entries:
        progress:
          trigger: success
          value: towel carried right above the basket opening (M1)
