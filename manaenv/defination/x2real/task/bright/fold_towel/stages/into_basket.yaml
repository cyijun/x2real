include: x2real/task/bright/fold_towel/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: bright_fold_towel_into_basket
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - inside:
              _func: object_position_in_zone
              object_cfg: '@towel'
              consecutive_steps: 10
              reference_cfg: '@container'
              velocity_threshold: 0.05
              reference_footprint_zone: true
              xy_inset_ratio: 0.05
              z_range: [-0.02, 0.12]
          - free:
              _func: object_no_contact_destination
              contact_sensor_cfgs:
              - '@towel_left_contact'
              - '@towel_right_contact'
              force_threshold: 0.05
              consecutive_steps: 10
    log_component:
      entries:
        progress:
          trigger: success
          value: towel dropped into the basket (P1)
