include: x2real/task/bright/stack_rings_reorder/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: bright_stack_rings_reorder_ring5_on_peg
  component_sections:
    termination_component:
      terms:
        success:
          _combine: and
          terms:
          - on_peg:
              _func: object_position_in_zone
              object_cfg: '@ring_5'
              consecutive_steps: 10
              reference_cfg: '@destination'
              velocity_threshold: 0.05
              in_reference_frame: true
              x_range: [-0.004, 0.004]
              y_range: [-0.004, 0.004]
              z_range: [0.086, 0.10200000000000001]
          - released:
              _func: object_no_contact_destination
              contact_sensor_cfgs:
              - '@ring5_left_contact'
              - '@ring5_right_contact'
              force_threshold: 0.05
              consecutive_steps: 10
          - base_held:
              _combine: or
              terms:
              - base_by_left:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@base_left_contact'
                  force_threshold: 0.1
                  consecutive_steps: 1
              - base_by_right:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@base_right_contact'
                  force_threshold: 0.1
                  consecutive_steps: 1
    log_component:
      entries:
        progress:
          trigger: success
          value: ring 5 put onto the peg and released (P3)
