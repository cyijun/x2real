graph_task_generator:
  definition:
    task_type: bright_stack_rings_reorder
    layout:
      runtime_sample:
        id: runtime
        targets:
          assets:
          - id: tablecloth_asset
            target:
              type: node
              id: tablecloth
            selector:
              type: uniform
          placements:
          - id: tablecloth
            target:
              type: node
              id: tablecloth
            sample:
              type: inherit
          - id: stack_layout
            target:
              type: group
              id: stack_layout
            sample:
              type: inherit
        global:
          lighting:
            dome:
              intensity:
                range: [600.0, 2600.0]
              color_temperature:
                range: [3600.0, 7500.0]
              rotation:
                range: [-180.0, 180.0]
    component_sections:
      log_component:
        entries:
          active_assets:
            trigger: enter
            func: schema_vnext_active_asset_ids_label
            params:
              object_names:
              - tablecloth
      instruction_component:
        instructions:
        - text: The largest ring is already at the bottom of the peg, but a small ring sits right on top of it.
            Hold the base of the ring stacker steady with the arm on its side; with the other arm take the misplaced
            ring off the peg, then put the remaining rings on the peg one at a time from the largest to the smallest.
          log:
            instruction_variant: direct
      overlay_component:
        evaluation: true
        entries:
        - log_key: active_assets
          label: Assets
          font_size: 18
      event_component:
        terms:
          bright_log_rings:
            _func: manaenv.terms.bright_events.bright_log_poses
            mode: interval
            interval_range_s: [0.1, 0.1]
            is_global_time: false
            asset_cfgs:
            - ring_1
            - ring_2
            - ring_3
            - ring_4
            - ring_5
            reference: stacker
            key: ringlog
            at_s: 7.0
  nodes:
