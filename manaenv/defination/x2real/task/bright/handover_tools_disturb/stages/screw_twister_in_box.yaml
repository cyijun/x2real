include: x2real/task/bright/handover_tools_disturb/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: bright_handover_tools_disturb_screw_twister_in_box
  component_sections:
    termination_component:
      terms:
        success:
          _combine: and
          terms:
          - inside:
              _func: object_position_in_zone
              object_cfg: '@tool_screw_twister'
              consecutive_steps: 10
              reference_cfg: '@toolbox'
              velocity_threshold: 0.05
              in_reference_frame: true
              x_range: [-0.085, 0.085]
              y_range: [-0.05, 0.05]
              z_range: [-0.005, 0.06]
          - free:
              _func: object_no_contact_destination
              contact_sensor_cfgs:
              - '@tool_screw_twister_left_contact'
              - '@tool_screw_twister_right_contact'
              force_threshold: 0.05
              consecutive_steps: 10
    log_component:
      entries:
        progress:
          trigger: success
          value: red T-handle screw placed in the toolbox (P2)
