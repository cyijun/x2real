graph_task_generator:
  definition:
    task_type: bright_fold_towel_train
    layout:
      runtime_sample:
        id: runtime
        targets:
          assets:
          - id: tablecloth_asset
            target:
              type: node
              id: tablecloth
            selector:
              type: uniform
          - id: towel_asset
            target:
              type: node
              id: towel
            selector:
              type: uniform
              distinct_id: towel_color
          - id: clutter_1_asset
            target:
              type: node
              id: clutter_1
            selector:
              type: uniform
          - id: clutter_2_asset
            target:
              type: node
              id: clutter_2
            selector:
              type: uniform
          placements:
          - id: tablecloth
            target:
              type: node
              id: tablecloth
            sample:
              type: inherit
          - id: towel
            target:
              type: node
              id: towel
            sample:
              type: inherit
          - id: basket_side
            target:
              type: group
              id: basket_side
            sample:
              type: inherit
        global:
          lighting:
            dome:
              intensity:
                range: [400.0, 3000.0]
              color_temperature:
                range: [3000.0, 8000.0]
              rotation:
                range: [-180.0, 180.0]
    component_sections:
      log_component:
        entries:
          active_assets:
            trigger: enter
            func: schema_vnext_active_asset_ids_label
            params:
              object_names:
              - tablecloth
              - towel
      instruction_component:
        instructions:
        - text: Grasp the two near corners of the towel with both hands and fold it once away from you, put it down
            and let go. Then with one hand grasp the middle of the folded edge, lift the folded towel, move it right
            above the basket, lower it close to the basket bottom and release it so it lies flat and folded in the
            basket.
          log:
            instruction_variant: direct
      overlay_component:
        evaluation: true
        entries:
        - log_key: active_assets
          label: Assets
          font_size: 18
  nodes:
  - id: grasp_corners
    include: x2real/task/bright/fold_towel_train/stages/grasp_corners.yaml
    score: 2
  - id: fold_lift
    include: x2real/task/bright/fold_towel_train/stages/fold_lift.yaml
    score: 2
  - id: release
    include: x2real/task/bright/fold_towel_train/stages/release.yaml
    score: 2
  - id: pick_folded
    include: x2real/task/bright/fold_towel_train/stages/pick_folded.yaml
    score: 2
  - id: over_basket
    include: x2real/task/bright/fold_towel_train/stages/over_basket.yaml
    score: 2
  - id: into_basket
    include: x2real/task/bright/fold_towel_train/stages/into_basket.yaml
    score: 2
  edges:
  - src: grasp_corners
    dst: fold_lift
  - src: fold_lift
    dst: release
  - src: release
    dst: pick_folded
  - src: pick_folded
    dst: over_basket
  - src: over_basket
    dst: into_basket
