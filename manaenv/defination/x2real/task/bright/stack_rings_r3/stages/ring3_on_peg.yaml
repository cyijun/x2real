include: x2real/task/bright/stack_rings_r3/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: bright_stack_rings_r3_ring3_on_peg
  component_sections:
    termination_component:
      terms:
        success:
          _combine: and
          terms:
          - on_peg:
              _func: object_position_in_zone
              object_cfg: '@ring_3'
              consecutive_steps: 10
              reference_cfg: '@destination'
              velocity_threshold: 0.05
              in_reference_frame: true
              x_range: [-0.012, 0.012]
              y_range: [-0.012, 0.012]
              z_range: [0.051000000000000004, 0.067]
          - released:
              _func: object_no_contact_destination
              contact_sensor_cfgs:
              - '@ring3_left_contact'
              - '@ring3_right_contact'
              force_threshold: 0.05
              consecutive_steps: 10
          - base_held:
              _combine: or
              terms:
              - base_by_left:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@base_left_contact'
                  force_threshold: 0.1
                  consecutive_steps: 1
              - base_by_right:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@base_right_contact'
                  force_threshold: 0.1
                  consecutive_steps: 1
    log_component:
      entries:
        progress:
          trigger: success
          value: ring 3 put onto the peg and released (P3)
