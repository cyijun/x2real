include: x2real/task/bright/arrange_flowers_distractor_b/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: bright_arrange_flowers_distractor_b_blue_to_middle
  component_sections:
    termination_component:
      terms:
        success:
          _combine: and
          terms:
          - mid:
              _func: object_position_in_zone
              object_cfg: '@flower_blue'
              consecutive_steps: 5
              x_range: [0.0, 0.4]
              y_range: [-0.4, -0.14]
              z_range: [-0.1404, 0.0096]
          - held:
              _combine: or
              terms:
              - flower_blue_by_left:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@flower_blue_left_contact'
                  force_threshold: 0.05
                  consecutive_steps: 1
              - flower_blue_by_right:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@flower_blue_right_contact'
                  force_threshold: 0.05
                  consecutive_steps: 1
          - untouched:
              _func: object_no_contact_destination
              contact_sensor_cfgs:
              - '@flower_blue_cloth_contact'
              force_threshold: 0.05
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: light blue rose lifted ~15 cm above the table centre, not touching the table (M1)
