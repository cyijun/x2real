include: x2real/task/bright/handover_tools_basket/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: bright_handover_tools_basket_hammer_to_middle
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - mid:
              _func: object_position_in_zone
              object_cfg: '@tool_1'
              consecutive_steps: 5
              x_range: [0.0, 0.4]
              y_range: [-0.4, -0.14]
              z_range: [-0.1404, 0.2596]
          - held:
              _func: object_contact_destination
              contact_sensor_cfgs: '@tool1_left_contact'
              force_threshold: 0.1
              consecutive_steps: 1
          - untouched:
              _func: object_no_contact_destination
              contact_sensor_cfgs:
              - '@tool1_cloth_contact'
              force_threshold: 0.05
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: hammer lifted above the table centre, not touching the table (M1)
