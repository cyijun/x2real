include: x2real/task/bright/handover_tools_basket/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: bright_handover_tools_basket_hammer_over_box
  component_sections:
    termination_component:
      terms:
        success:
          _combine: and
          terms:
          - above:
              _func: object_position_in_zone
              object_cfg: '@tool_hammer'
              consecutive_steps: 3
              reference_cfg: '@toolbox'
              in_reference_frame: true
              x_range: [-0.16, 0.16]
              y_range: [-0.115, 0.115]
              z_range: [0.04, 0.35]
          - held:
              _combine: or
              terms:
              - tool_hammer_by_left:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@tool_hammer_left_contact'
                  force_threshold: 0.05
                  consecutive_steps: 1
              - tool_hammer_by_right:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@tool_hammer_right_contact'
                  force_threshold: 0.05
                  consecutive_steps: 1
    log_component:
      entries:
        progress:
          trigger: success
          value: hammer aligned above the green basket opening (M3)
