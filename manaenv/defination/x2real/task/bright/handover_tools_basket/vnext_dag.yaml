graph_task_generator:
  definition:
    task_type: bright_handover_tools_basket
    layout:
      runtime_sample:
        id: runtime
        targets:
          assets:
          - id: tablecloth_asset
            target:
              type: node
              id: tablecloth
            selector:
              type: uniform
          placements:
          - id: tablecloth
            target:
              type: node
              id: tablecloth
            sample:
              type: inherit
          - id: box
            target:
              type: node
              id: box
            sample:
              type: inherit
          - id: gear
            target:
              type: node
              id: gear
            sample:
              type: inherit
          - id: tools_region
            target:
              type: group
              id: tools_region
            sample:
              type: inherit
        global:
          lighting:
            dome:
              intensity:
                range: [600.0, 2600.0]
              color_temperature:
                range: [3600.0, 7500.0]
              rotation:
                range: [-180.0, 180.0]
    component_sections:
      log_component:
        entries:
          active_assets:
            trigger: enter
            func: schema_vnext_active_asset_ids_label
            params:
              object_names:
              - tablecloth
      instruction_component:
        instructions:
        - text: With the left hand pick up the hammer, lift it above the middle of the table and hand it to the
            right hand in mid-air, then put it into the green basket; then do the same with the wrench.
          log:
            instruction_variant: direct
      overlay_component:
        evaluation: true
        entries:
        - log_key: active_assets
          label: Assets
          font_size: 18
  nodes:
  - id: pick_hammer
    include: x2real/task/bright/handover_tools_basket/stages/pick_hammer.yaml
    score: 2
  - id: hammer_to_middle
    include: x2real/task/bright/handover_tools_basket/stages/hammer_to_middle.yaml
    score: 2
  - id: hammer_handover
    include: x2real/task/bright/handover_tools_basket/stages/hammer_handover.yaml
    score: 2
  - id: hammer_over_box
    include: x2real/task/bright/handover_tools_basket/stages/hammer_over_box.yaml
    score: 2
  - id: hammer_in_box
    include: x2real/task/bright/handover_tools_basket/stages/hammer_in_box.yaml
    score: 2
  - id: pick_wrench
    include: x2real/task/bright/handover_tools_basket/stages/pick_wrench.yaml
    score: 2
  - id: wrench_to_middle
    include: x2real/task/bright/handover_tools_basket/stages/wrench_to_middle.yaml
    score: 2
  - id: wrench_handover
    include: x2real/task/bright/handover_tools_basket/stages/wrench_handover.yaml
    score: 2
  - id: wrench_over_box
    include: x2real/task/bright/handover_tools_basket/stages/wrench_over_box.yaml
    score: 2
  - id: wrench_in_box
    include: x2real/task/bright/handover_tools_basket/stages/wrench_in_box.yaml
    score: 2
  edges:
  - src: pick_hammer
    dst: hammer_to_middle
  - src: hammer_to_middle
    dst: hammer_handover
  - src: hammer_handover
    dst: hammer_over_box
  - src: hammer_over_box
    dst: hammer_in_box
  - src: hammer_in_box
    dst: pick_wrench
  - src: pick_wrench
    dst: wrench_to_middle
  - src: wrench_to_middle
    dst: wrench_handover
  - src: wrench_handover
    dst: wrench_over_box
  - src: wrench_over_box
    dst: wrench_in_box
