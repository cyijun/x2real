    task_type: bright_handover_tools_hammer_handover
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - right:
              _func: object_contact_destination
              contact_sensor_cfgs: '@tool1_right_contact'
              force_threshold: 0.1
              consecutive_steps: 5
          - left_free:
              _func: object_no_contact_destination
              contact_sensor_cfgs:
              - '@tool1_left_contact'
              force_threshold: 0.05
              consecutive_steps: 5
          - airborne:
              _func: object_position_in_zone
              object_cfg: '@tool_1'
              consecutive_steps: 5
              z_range: [-0.2104, 0.2596]
    log_component:
      entries:
        progress:
          trigger: success
          value: right hand takes the hammer, left releases (C2)
