include: x2real/task/bright/handover_tools/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: bright_handover_tools_hammer_to_middle
  component_sections:
    termination_component:
      terms:
        success:
          _combine: and
          terms:
          - mid:
              _func: object_position_in_zone
              object_cfg: '@tool_hammer'
              consecutive_steps: 5
              x_range: [0.0, 0.4]
              y_range: [-0.4, -0.14]
              z_range: [-0.1404, 0.0096]
          - held:
              _combine: or
              terms:
              - tool_hammer_by_left:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@tool_hammer_left_contact'
                  force_threshold: 0.05
                  consecutive_steps: 1
              - tool_hammer_by_right:
                  _func: object_contact_destination
                  contact_sensor_cfgs: '@tool_hammer_right_contact'
                  force_threshold: 0.05
                  consecutive_steps: 1
          - untouched:
              _func: object_no_contact_destination
              contact_sensor_cfgs:
              - '@tool_hammer_cloth_contact'
              force_threshold: 0.05
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: hammer lifted ~15 cm above the table centre, not touching the table (M1)
