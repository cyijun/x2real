include: x2real/task/bright/handover_tools/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: bright_handover_tools_wrench_handover
  component_sections:
    termination_component:
      terms:
        success:
          terms:
          - right:
              _func: object_contact_destination
              contact_sensor_cfgs: '@tool2_right_contact'
              force_threshold: 0.05
              consecutive_steps: 5
          - left_free:
              _func: object_no_contact_destination
              contact_sensor_cfgs:
              - '@tool2_left_contact'
              force_threshold: 0.05
              consecutive_steps: 5
          - airborne:
              _func: object_position_in_zone
              object_cfg: '@tool_2'
              consecutive_steps: 5
              z_range: [-0.1904, 0.3596]
          - untouched:
              _func: object_no_contact_destination
              contact_sensor_cfgs:
              - '@tool2_cloth_contact'
              force_threshold: 0.05
              consecutive_steps: 5
    log_component:
      entries:
        progress:
          trigger: success
          value: right hand takes the wrench in mid-air, left releases (C2)
