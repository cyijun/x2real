include: x2real/task/bright/pour_beans_disturb/stages/_stage_base.yaml
direct_task_generator:
  definition:
    task_type: bright_pour_beans_disturb_pour
  component_sections:
    termination_component:
      terms:
        success:
          _combine: and
          terms:
          - all_beans:
              _func: objects_count_in_relative_zone
              object_names:
              - bean_1
              - bean_2
              - bean_3
              - bean_4
              - bean_5
              - bean_6
              - bean_7
              - bean_8
              - bean_9
              reference_cfg: '@target_bowl'
              min_count: 9
              xy_distance_threshold: 0.09
              z_min_offset: -0.01
              z_max_offset: 0.1
              velocity_threshold: 0.3
              consecutive_steps: 10
          - hands:
              _combine: or
              terms:
              - bowl_left__cup_right:
                  _combine: and
                  terms:
                  - bowl_left:
                      _func: object_contact_destination
                      contact_sensor_cfgs: '@bowl_left_contact'
                      force_threshold: 0.1
                      consecutive_steps: 1
                  - cup_right:
                      _func: object_contact_destination
                      contact_sensor_cfgs: '@cup_right_contact'
                      force_threshold: 0.1
                      consecutive_steps: 1
              - bowl_right__cup_left:
                  _combine: and
                  terms:
                  - bowl_right:
                      _func: object_contact_destination
                      contact_sensor_cfgs: '@bowl_right_contact'
                      force_threshold: 0.1
                      consecutive_steps: 1
                  - cup_left:
                      _func: object_contact_destination
                      contact_sensor_cfgs: '@cup_left_contact'
                      force_threshold: 0.1
                      consecutive_steps: 1
    log_component:
      entries:
        progress:
          trigger: success
          value: all beans poured into the bowl while the other hand holds it (L3)
