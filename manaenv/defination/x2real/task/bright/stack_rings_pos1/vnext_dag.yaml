graph_task_generator:
  definition:
    task_type: bright_stack_rings_pos1
    layout:
      runtime_sample:
        id: runtime
        targets:
          assets:
          - id: tablecloth_asset
            target:
              type: node
              id: tablecloth
            selector:
              type: uniform
          placements:
          - id: tablecloth
            target:
              type: node
              id: tablecloth
            sample:
              type: inherit
          - id: stack_layout
            target:
              type: group
              id: stack_layout
            sample:
              type: inherit
        global:
          lighting:
            dome:
              intensity:
                range: [600.0, 2600.0]
              color_temperature:
                range: [3600.0, 7500.0]
              rotation:
                range: [-180.0, 180.0]
    component_sections:
      log_component:
        entries:
          active_assets:
            trigger: enter
            func: schema_vnext_active_asset_ids_label
            params:
              object_names:
              - tablecloth
      instruction_component:
        instructions:
        - text: Hold the base of the ring stacker steady with the arm on its side. With the other arm put the largest
            ring onto the peg one at a time, from the largest to the smallest.
          log:
            instruction_variant: direct
      overlay_component:
        evaluation: true
        entries:
        - log_key: active_assets
          label: Assets
          font_size: 18
  nodes:
  - id: press_base
    include: x2real/task/bright/stack_rings_pos1/stages/press_base.yaml
    score: 2
  - id: pick_ring1
    include: x2real/task/bright/stack_rings_pos1/stages/pick_ring1.yaml
    score: 2
  - id: ring1_above_peg
    include: x2real/task/bright/stack_rings_pos1/stages/ring1_above_peg.yaml
    score: 2
  - id: ring1_aligned
    include: x2real/task/bright/stack_rings_pos1/stages/ring1_aligned.yaml
    score: 2
  - id: ring1_on_peg
    include: x2real/task/bright/stack_rings_pos1/stages/ring1_on_peg.yaml
    score: 2
  edges:
  - src: press_base
    dst: pick_ring1
  - src: pick_ring1
    dst: ring1_above_peg
  - src: ring1_above_peg
    dst: ring1_aligned
  - src: ring1_aligned
    dst: ring1_on_peg
