direct_task_generator:
  definition:
    gen_method: 0
    episode_length_s: 100.0
    num_episodes: 10
    max_steps_per_episode: 3000
  component_sections:
    termination_component:
      terms:
        mdp.time_out:
          time_out: true
        object_dropped:
          object_cfg: '@pickable'
          minimum_height: -0.25
          ignore_below: -1.0
    event_component:
      terms:
        mdp.reset_scene_to_default:
          mode: reset
          reset_joint_targets: true
    metric_component:
      terms:
        success_rate: {}
        object_moved_rate:
          object_cfg: '@pickable'
    viewer_component:
      terms:
        look_at_position:
          lookat_position: [0.204651, -0.268246, -0.240423]
          offset: [-1.0, 0.0, 1.5]
    scene_constraint_component:
      constraints:
      - mode: 0
        tags: bright_stack_rings_r1_scene
    sensor_component:
      sensors:
      - base_left_contact:
          type: contact
          source: '@stacker'
          against: &id001
          - '{ENV_REGEX_NS}/Robot/left_arm_gripper_left_link'
          - '{ENV_REGEX_NS}/Robot/left_arm_gripper_left_tip_link'
          - '{ENV_REGEX_NS}/Robot/left_arm_gripper_right_link'
          - '{ENV_REGEX_NS}/Robot/left_arm_gripper_right_tip_link'
      - base_right_contact:
          type: contact
          source: '@stacker'
          against: &id002
          - '{ENV_REGEX_NS}/Robot/right_arm_gripper_left_link'
          - '{ENV_REGEX_NS}/Robot/right_arm_gripper_left_tip_link'
          - '{ENV_REGEX_NS}/Robot/right_arm_gripper_right_link'
          - '{ENV_REGEX_NS}/Robot/right_arm_gripper_right_tip_link'
      - ring1_left_contact:
          type: contact
          source: '@ring_1'
          against: *id001
      - ring1_right_contact:
          type: contact
          source: '@ring_1'
          against: *id002
