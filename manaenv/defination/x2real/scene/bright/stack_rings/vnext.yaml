definition:
  scene_type: bright_stack_rings_scene
  metadata:
    name: bright_stack_rings
    source: bright/stack_rings
    semantic_goal: Hold the round stacker base with the left hand and stack three rings large-to-small on its single
      peg
render_settings:
  gen_method: 0
  tags: green_booth
background:
  id: booth
  asset:
    type: asset_id
    id: green_booth_mesh
  pose:
    position: [-0.452, -0.271, -0.985]
    orientation: [0.0, 0.0, -0.704, 0.709]
  required_surfaces:
  - tabletop
objects:
- id: tablecloth
  asset:
    type: pool
    candidates:
    - id: any
      assets:
      - bright_tablecloth_blue_cloud
      - bright_tablecloth_red_check
      - bright_tablecloth_forest_deer
      - bright_tablecloth_gray_grid
  semantic_tags:
  - background_cloth
  kinematic: true
  anchors:
    local_surfaces:
      top:
        center: [0.0, 0.0, 0.0015]
        x_axis: [-1.0, 0.0, 0.0]
        y_axis: [0.0, -1.0, 0.0]
        bounds:
          x: [-0.32, 0.32]
          y: [-0.53, 0.53]
- id: stacker
  asset:
    type: asset_id
    id: bright_stacker_round
  semantic_tags:
  - destination
  - stacker
- id: ring_large
  asset:
    type: asset_id
    id: bright_ring_large
  semantic_tags:
  - pickable
  - ring_1
- id: ring_medium
  asset:
    type: asset_id
    id: bright_ring_medium
  semantic_tags:
  - pickable
  - ring_2
- id: ring_small
  asset:
    type: asset_id
    id: bright_ring_small
  semantic_tags:
  - pickable
  - ring_3
- id: ring_extra
  asset:
    type: asset_id
    id: bright_ring_extra
  semantic_tags:
  - distractor
layout:
  surfaces:
    tabletop:
      type: ref
      ref: background.tabletop
    cloth:
      type: ref
      ref: tablecloth.top
  nodes:
    tablecloth:
      object: tablecloth
      placement:
        type: surface
        surface: tabletop
        ranges:
          x: [0.0, 0.0]
          y: [0.0, 0.0]
        yaws: 0.0
    stacker:
      object: stacker
      placement:
        type: surface
        surface: cloth
        ranges:
          x: [-0.02, 0.04]
          y: [-0.05, 0.03]
    ring_large:
      object: ring_large
    ring_medium:
      object: ring_medium
    ring_small:
      object: ring_small
    ring_extra:
      object: ring_extra
  groups:
    rings_region:
      type: slot
      nodes:
      - ring_large
      - ring_medium
      - ring_small
      - ring_extra
      slots:
        slot_0:
          type: surface
          surface: cloth
          ranges:
            x: [0.13, 0.22]
            y: [0.1, 0.16]
          yaws: &id001 [-3.14, 3.14]
        slot_1:
          type: surface
          surface: cloth
          ranges:
            x: [0.13, 0.22]
            y: [0.22, 0.28]
          yaws: *id001
        slot_2:
          type: surface
          surface: cloth
          ranges:
            x: [0.13, 0.22]
            y: [0.34, 0.4]
          yaws: *id001
        slot_3:
          type: surface
          surface: cloth
          ranges:
            x: [-0.18, -0.1]
            y: [0.16, 0.3]
          yaws: *id001
      assignments:
        mode: permutation
        nodes:
        - ring_large
        - ring_medium
        - ring_small
        - ring_extra
        slots:
        - slot_0
        - slot_1
        - slot_2
        - slot_3
      default_assignment: perm_0
variants:
  materialization:
  - id: tablecloth_pick
    type: asset_pool_choice
    choices:
    - id: pick_any
      candidate_refs:
      - tablecloth.any
      weight: 1.0
  assignments: []
