definition:
  scene_type: bright_fold_towel_visual_scene
  metadata:
    name: bright_fold_towel_visual
    source: bright/fold_towel
    semantic_goal: 'Fold the towel in half away from the robot, then put it flat into the basket | case: terracotta
      table, warm or cool background board behind the table, dome 2800-8500 K'
render_settings:
  gen_method: 0
  tags: green_booth
background:
  id: booth
  asset:
    type: asset_id
    id: green_booth_mesh
  pose:
    position: [-0.452, -0.271, -0.985]
    orientation: [0.0, 0.0, -0.704, 0.709]
  required_surfaces:
  - tabletop
objects:
- id: tablecloth
  asset:
    type: pool
    candidates:
    - id: any
      assets:
      - bright_tablecloth_solid_terracotta
  semantic_tags:
  - background_cloth
  kinematic: true
  anchors:
    local_surfaces:
      top:
        center: [0.0, 0.0, 0.0015]
        x_axis: [-1.0, 0.0, 0.0]
        y_axis: [0.0, -1.0, 0.0]
        bounds:
          x: [-0.32, 0.32]
          y: [-0.53, 0.53]
- id: towel
  asset:
    type: pool
    candidates:
    - id: any
      assets:
      - bright_towel_blue
      - bright_towel_pink
      - bright_towel_yellow
      - bright_towel_green
      - bright_towel_purple
  semantic_tags:
  - pickable
  - towel
  - cloth_placeholder
- id: basket
  asset:
    type: asset_id
    id: bright_basket_green
  semantic_tags:
  - container
- id: backdrop
  asset:
    type: pool
    cache_size: 2
    cache_slot_order: authored
    candidates:
    - id: warm
      assets:
      - bright_backdrop_warm
    - id: cool
      assets:
      - bright_backdrop_cool
  semantic_tags:
  - fixture
  kinematic: true
layout:
  surfaces:
    tabletop:
      type: ref
      ref: background.tabletop
    cloth:
      type: ref
      ref: tablecloth.top
  nodes:
    tablecloth:
      object: tablecloth
      placement:
        type: surface
        surface: tabletop
        ranges:
          x: [0.0, 0.0]
          y: [0.0, 0.0]
        yaws: 0.0
    towel:
      object: towel
      placement:
        type: surface
        surface: cloth
        ranges:
          x: [0.1, 0.16]
          y: [-0.04, 0.04]
        yaws: [-0.15, 0.15]
    basket:
      object: basket
    backdrop:
      object: backdrop
      placement:
        type: surface
        surface: cloth
        ranges:
          x: [-0.292, -0.288]
          y: [-0.005, 0.005]
        yaws: 0.0
  groups:
    basket_side:
      type: slot
      nodes:
      - basket
      slots:
        basket_L:
          type: surface
          surface: cloth
          ranges:
            x: [-0.14, -0.08]
            y: [0.24, 0.32]
          yaws: [1.5608, 1.5808]
        basket_R:
          type: surface
          surface: cloth
          ranges:
            x: [-0.14, -0.08]
            y: [-0.32, -0.24]
          yaws: [1.5608, 1.5808]
      assignments:
        mode: explicit
        items:
        - id: l0
          bindings:
            basket: basket_L
        - id: r0
          bindings:
            basket: basket_R
      default_assignment: l0
variants:
  materialization:
  - id: tablecloth_pick
    type: asset_pool_choice
    choices:
    - id: pick_any
      candidate_refs:
      - tablecloth.any
      weight: 1.0
  - id: towel_pick
    type: asset_pool_choice
    choices:
    - id: pick_any
      candidate_refs:
      - towel.any
      weight: 1.0
  - id: backdrop_pick
    type: asset_pool_choice
    choices:
    - id: pick_warm
      candidate_refs:
      - backdrop.warm
      weight: 1.0
    - id: pick_cool
      candidate_refs:
      - backdrop.cool
      weight: 0.001
  assignments: []
