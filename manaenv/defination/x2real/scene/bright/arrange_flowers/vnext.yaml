definition:
  scene_type: bright_arrange_flowers_scene
  metadata:
    name: bright_arrange_flowers
    source: bright/arrange_flowers
    semantic_goal: Insert the red and the pink crochet roses stem-first into the vase (mid-air handover)
render_settings:
  gen_method: 0
  tags: green_booth
background:
  id: booth
  asset:
    type: asset_id
    id: green_booth_mesh
  pose:
    position: [-0.452, -0.271, -0.985]
    orientation: [0.0, 0.0, -0.704, 0.709]
  required_surfaces:
  - tabletop
objects:
- id: tablecloth
  asset:
    type: pool
    candidates:
    - id: any
      assets:
      - bright_tablecloth_blue_cloud
      - bright_tablecloth_red_check
      - bright_tablecloth_forest_deer
      - bright_tablecloth_gray_grid
  semantic_tags:
  - background_cloth
  kinematic: true
  anchors:
    local_surfaces:
      top:
        center: [0.0, 0.0, 0.0015]
        x_axis: [-1.0, 0.0, 0.0]
        y_axis: [0.0, -1.0, 0.0]
        bounds:
          x: [-0.32, 0.32]
          y: [-0.53, 0.53]
- id: vase
  asset:
    type: asset_id
    id: bright_vase_white
  semantic_tags:
  - container
  - vase
- id: flower_1
  asset:
    type: asset_id
    id: bright_flower_rose_red
  semantic_tags:
  - pickable
  - flower_1
- id: flower_2
  asset:
    type: asset_id
    id: bright_flower_rose_pink
  semantic_tags:
  - pickable
  - flower_2
- id: flower_3
  asset:
    type: pool
    candidates:
    - id: any
      assets:
      - bright_flower_rose_purple
      - bright_flower_rose_orange
  semantic_tags:
  - distractor
- id: lily
  asset:
    type: asset_id
    id: bright_flower_lily_white
  semantic_tags:
  - distractor
layout:
  surfaces:
    tabletop:
      type: ref
      ref: background.tabletop
    cloth:
      type: ref
      ref: tablecloth.top
  nodes:
    tablecloth:
      object: tablecloth
      placement:
        type: surface
        surface: tabletop
        ranges:
          x: [0.0, 0.0]
          y: [0.0, 0.0]
        yaws: 0.0
    vase:
      object: vase
      placement:
        type: surface
        surface: cloth
        ranges:
          x: [-0.06, 0.04]
          y: [0.18, 0.3]
    flower_1:
      object: flower_1
    flower_2:
      object: flower_2
    flower_3:
      object: flower_3
    lily:
      object: lily
  groups:
    flowers_region:
      type: slot
      nodes:
      - flower_1
      - flower_2
      - flower_3
      - lily
      slots:
        slot_0:
          type: surface
          surface: cloth
          ranges:
            x: [-0.03, 0.07]
            y: [-0.46, -0.42]
          yaws: &id001 [-0.12, 0.12]
        slot_1:
          type: surface
          surface: cloth
          ranges:
            x: [-0.03, 0.07]
            y: [-0.35, -0.31]
          yaws: *id001
        slot_2:
          type: surface
          surface: cloth
          ranges:
            x: [-0.03, 0.07]
            y: [-0.24, -0.2]
          yaws: *id001
        slot_3:
          type: surface
          surface: cloth
          ranges:
            x: [-0.03, 0.07]
            y: [-0.13, -0.09]
          yaws: *id001
      assignments:
        mode: permutation
        nodes:
        - flower_1
        - flower_2
        - flower_3
        - lily
        slots:
        - slot_0
        - slot_1
        - slot_2
        - slot_3
      default_assignment: perm_0
variants:
  materialization:
  - id: tablecloth_pick
    type: asset_pool_choice
    choices:
    - id: pick_any
      candidate_refs:
      - tablecloth.any
      weight: 1.0
  - id: flower_3_pick
    type: asset_pool_choice
    choices:
    - id: pick_any
      candidate_refs:
      - flower_3.any
      weight: 1.0
  assignments: []
