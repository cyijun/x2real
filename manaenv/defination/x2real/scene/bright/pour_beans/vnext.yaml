definition:
  scene_type: bright_pour_beans_scene
  metadata:
    name: bright_pour_beans
    source: bright/pour_beans
    semantic_goal: Left hand steadies the light (20 cm, 130 g, low-friction) bowl on the table, right hand pours
      all red beans from the cup into it and puts the cup back
render_settings:
  gen_method: 0
  tags: green_booth
background:
  id: booth
  asset:
    type: asset_id
    id: green_booth_mesh
  pose:
    position: [-0.452, -0.271, -0.985]
    orientation: [0.0, 0.0, -0.704, 0.709]
  required_surfaces:
  - tabletop
objects:
- id: target_bowl
  asset:
    type: asset_id
    id: bright_bowl_blue
  semantic_tags:
  - container
  - target_bowl
- id: distractor_bowl
  asset:
    type: pool
    candidates:
    - id: any
      assets:
      - bright_bowl_pink
      - bright_bowl_beige
      - bright_bowl_mint
  semantic_tags:
  - distractor
- id: bean_cup
  asset:
    type: asset_id
    id: bright_cup_green
  semantic_tags:
  - pickable
  - bean_cup
  anchors:
    local_surfaces:
      rim:
        center: [0.0, 0.0, 0.102]
        x_axis: [1.0, 0.0, 0.0]
        y_axis: [0.0, 1.0, 0.0]
        bounds:
          x: [-0.026, 0.026]
          y: [-0.026, 0.026]
- id: empty_cup
  asset:
    type: pool
    candidates:
    - id: any
      assets:
      - bright_cup_purple
      - bright_cup_pink
      - bright_cup_beige
      - bright_cup_blue
      - bright_measuring_cup_blue
  semantic_tags:
  - distractor_cup
- id: beans
  asset:
    type: asset_id
    id: bright_bean_red
  instances:
    type: auto
    count: 9
    template: bean_{i}
    start_index: 1
  spawn_mass: [0.0003, 0.0005]
  semantic_tags:
  - content
  - beans
layout:
  surfaces:
    tabletop:
      type: ref
      ref: background.tabletop
    cup_rim:
      type: ref
      ref: bean_cup.rim
  nodes:
    target_bowl:
      object: target_bowl
      placement:
        type: surface
        surface: tabletop
        ranges:
          x: [0.05, 0.12]
          y: [-0.23, -0.15]
    bean_cup:
      object: bean_cup
      placement:
        type: surface
        surface: tabletop
        ranges:
          x: [0.04, 0.12]
          y: [0.08, 0.16]
    distractor_bowl:
      object: distractor_bowl
      placement:
        type: surface
        surface: tabletop
        ranges:
          x: [-0.21, -0.17]
          y: [-0.36, -0.2]
    empty_cup:
      object: empty_cup
      placement:
        type: surface
        surface: tabletop
        ranges:
          x: [-0.14, 0.1]
          y: [0.3, 0.42]
  groups:
    beans_in_cup:
      type: region
      nodes: '@instances:beans'
      surface: cup_rim
      ranges:
        x: [-0.024, 0.024]
        y: [-0.024, 0.024]
      yaws: 0.0
      sample_method: stratified
      spacing_mode: center_distance
      min_spacing: 0.003
      jitter: 0.2
      max_attempts: 4000
      ignore_intra_group_collision: true
variants:
  materialization:
  - id: distractor_bowl_pick
    type: asset_pool_choice
    choices:
    - id: pick_any
      candidate_refs:
      - distractor_bowl.any
      weight: 1.0
  - id: empty_cup_pick
    type: asset_pool_choice
    choices:
    - id: pick_any
      candidate_refs:
      - empty_cup.any
      weight: 1.0
  assignments: []
