definition:
  scene_type: bright_fold_towel_cloth_scene
  metadata:
    name: bright_fold_towel_cloth
    source: bright/fold_towel_cloth
    semantic_goal: Fold the towel in half away from the robot, then put it into the basket
render_settings:
  gen_method: 0
  tags: green_booth
background:
  id: booth
  asset:
    type: asset_id
    id: green_booth_mesh
  pose:
    position: [-0.452, -0.271, -0.985]
    orientation: [0.0, 0.0, -0.704, 0.709]
  required_surfaces:
  - tabletop
objects:
- id: tablecloth
  asset:
    type: pool
    candidates:
    - id: any
      assets:
      - bright_tablecloth_blue_cloud_clothbox
      - bright_tablecloth_red_check_clothbox
      - bright_tablecloth_forest_deer_clothbox
      - bright_tablecloth_gray_grid_clothbox
  semantic_tags:
  - background_cloth
  kinematic: true
  anchors:
    local_surfaces:
      top:
        center: [0.0, 0.0, 0.0015]
        x_axis: [-1.0, 0.0, 0.0]
        y_axis: [0.0, -1.0, 0.0]
        bounds:
          x: [-0.32, 0.32]
          y: [-0.53, 0.53]
- id: towel
  asset:
    type: asset_id
    id: bright_towel_proxy
  semantic_tags:
  - pickable
  - towel
  - surface_cloth_proxy
  - cloth_profile=bright_towel_30
  kinematic: true
- id: basket
  asset:
    type: pool
    cache_size: 3
    cache_slot_order: authored
    candidates:
    - id: green
      assets:
      - bright_basket_green
    - id: blue
      assets:
      - bright_basket_blue
    - id: pink_box
      assets:
      - bright_bin_pink
  semantic_tags:
  - container
- id: distractor_towel
  asset:
    type: pool
    candidates:
    - id: any
      assets:
      - bright_towel_blue
      - bright_towel_pink
      - bright_towel_yellow
      - bright_towel_green
      - bright_towel_purple
  semantic_tags:
  - distractor
layout:
  surfaces:
    tabletop:
      type: ref
      ref: background.tabletop
    cloth:
      type: ref
      ref: tablecloth.top
  nodes:
    tablecloth:
      object: tablecloth
      placement:
        type: surface
        surface: tabletop
        ranges:
          x: [0.0, 0.0]
          y: [0.0, 0.0]
        yaws: 0.0
    towel:
      object: towel
      placement:
        type: surface
        surface: cloth
        ranges:
          x: [0.035, 0.085]
          y: [-0.008, 0.008]
        yaws: [-0.035, 0.035]
    basket:
      object: basket
      placement:
        type: surface
        surface: cloth
        ranges:
          x: [-0.11, -0.07]
          y: [0.339, 0.348]
        yaws: 1.5708
    distractor_towel:
      object: distractor_towel
      placement:
        type: surface
        surface: cloth
        ranges:
          x: [-0.13, -0.09]
          y: [-0.35, -0.34]
        yaws: [-0.04, 0.04]
variants:
  materialization:
  - id: tablecloth_pick
    type: asset_pool_choice
    choices:
    - id: pick_any
      candidate_refs:
      - tablecloth.any
      weight: 1.0
  - id: basket_pick
    type: asset_pool_choice
    choices:
    - id: pick_green
      candidate_refs:
      - basket.green
      weight: 1.0
    - id: pick_blue
      candidate_refs:
      - basket.blue
      weight: 0.001
    - id: pick_pink_box
      candidate_refs:
      - basket.pink_box
      weight: 0.001
  - id: distractor_towel_pick
    type: asset_pool_choice
    choices:
    - id: pick_any
      candidate_refs:
      - distractor_towel.any
      weight: 1.0
  assignments: []
